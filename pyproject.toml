[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "plo5bp"
version = "0.1.0"
description = "WrapGTO: PLO5 double-board bomb-pot self-play training, study tool and website"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  # CPU wheel by default; CUDA: see SETUP.md (cu128 wheels).
  "torch>=2.2",
]

# What each part NEEDS (ranges). What each machine RUNS (exact) is in requirements/.
# Setups: SETUP.md. The production server installs requirements/server.txt.
# (Extras are listed in full, never as "plo5bp[...]": some installers would look
# that name up on PyPI.)
[project.optional-dependencies]
# The web app (study / trainer / home games) — what the server runs.
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
# Public build (PLO5BP_PUBLIC=1): the web app + Google sign-in, cookie sessions, Stripe.
public = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "authlib>=1.3",
  # Authlib's Starlette OAuth client imports httpx at module import; without it
  # `public.install` raises ModuleNotFoundError at boot once Google creds are set.
  "httpx>=0.27",
  "itsdangerous>=2.1",
  "stripe>=9.0",
]
# The CFR Solver desktop app and its shortcut installer — never on the server.
desktop = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",  # CFR app solution upload
  "pywebview>=5.0",           # native desktop window
  # Desktop-shortcut installer (scripts/install_cfr_desktop_shortcut.py).
  "pywin32>=306; sys_platform == 'win32'",
]
# The older name for web + desktop (kept so `.[ui,dev]` in old notes still works).
ui = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pywebview>=5.0",
  "pywin32>=306; sys_platform == 'win32'",
]
# Live table capture (local build only).
ocr = [
  "pytesseract>=0.3.10",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
  "mss>=9.0",
  "pygetwindow>=0.0.9; sys_platform == 'win32'",
  "windows-capture>=2.0; sys_platform == 'win32'",
]
# Everything the test suite needs (the web + public packages too, so the UI and
# billing tests run instead of skipping).
dev = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.1",
  "stripe>=9.0",
  # The CFR app's upload route needs it at import (FastAPI refuses a form route without
  # it), and its tests import the app: without it CI stopped at collection (2026-10-03).
  "python-multipart>=0.0.9",
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "maturin>=1.7,<2.0",
]

[tool.pytest.ini_options]
# `pytest` alone runs everything under tests/. Every test carries its area's marker
# (applied by file in tests/conftest.py), so a subset needs no file list:
#   pytest -m "homegame or public or ui or ops"    the website — before a deploy
#   pytest -m training                             engine / encoders / rollout / PPO
#   pytest -m "not slow"                           a quick pass
testpaths = ["tests"]
# -ra: a summary of every skip at the end, so a skipped area is never silent.
addopts = "-ra"
markers = [
  "training: the engine, encoders, envs, rollout, PPO, networks (tests/python by default)",
  "homegame: home games — tables, clubs, the verified shuffle, grading, the client",
  "public: the public site's service layer — sign-in, billing, admin, access rules",
  "ui: study / trainer / ranges pages and their server",
  "cfr: the NLH CFR solver, GTO teacher pipeline and the CFR desktop app",
  "ocr: live table capture (ClubGG OCR, PokerNow)",
  "ops: the deploy, backup and server tooling (scripts/deploy_prod.sh, ops/)",
  "node: runs JavaScript under Node.js",
  "slow: minutes on a laptop CPU — deselect with -m 'not slow'",
  "engine: needs the compiled Rust engine",
  "gpu: needs CUDA",
]
# A hang guard, not a speed limit (pytest-timeout, in the dev extra).
timeout = 1200

[tool.maturin]
module-name = "plo5bp._engine"
python-source = "python"
manifest-path = "rust_engine/Cargo.toml"
features = ["pyo3/extension-module"]
