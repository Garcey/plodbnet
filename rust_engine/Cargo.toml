[package]
name = "plo5bp_engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "plo5bp_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
numpy = "0.23"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.8"

[dev-dependencies]
rand = "0.8"
