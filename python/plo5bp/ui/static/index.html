<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLO5 Bomb-Pot Study Tool</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header id="top-bar">
      <div class="top-bar-item">
        <label>Seats</label>
        <div class="seat-ctl">
          <button id="seats-dec" type="button" aria-label="Fewer seats">−</button>
          <span id="seats-count">6</span>
          <button id="seats-inc" type="button" aria-label="More seats">+</button>
        </div>
      </div>
      <div class="top-bar-item">
        <label for="unit-toggle">Units</label>
        <button id="unit-toggle" type="button">bb</button>
      </div>
      <div class="top-bar-item">
        <label for="dpb-input">$ / bb</label>
        <input id="dpb-input" type="number" step="0.01" min="0.01" value="20.00" />
      </div>
      <div class="top-bar-item">
        <label for="ante-input">Ante</label>
        <input id="ante-input" type="number" step="0.01" min="0" value="3.00" />
      </div>
      <div class="top-bar-item top-bar-spacer"></div>
      <div class="top-bar-item ocr-group">
        <label for="ocr-window-button">OCR</label>
        <div class="ocr-window-picker">
          <button id="ocr-window-button" type="button" aria-haspopup="listbox"
                  aria-expanded="false" title="Pick the window to screen-read">— pick window —</button>
        </div>
        <button id="ocr-toggle" type="button" aria-pressed="false">Off</button>
        <button id="ocr-simple-toggle" type="button" aria-pressed="true"
                title="Skip OCR action inference; manual action entry only">Simple: On</button>
        <button id="ocr-save-frame" type="button"
                title="Save the current OCR frame to screenrecords/frames/">Save frame</button>
        <span id="ocr-status" class="muted"></span>
      </div>
      <div class="top-bar-item">
        <button id="new-hand-btn" type="button">New Hand</button>
      </div>
    </header>

    <main>
      <section id="table-area">
        <div id="table-wrap">
          <svg id="table-svg" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="felt-gradient" cx="50%" cy="38%" r="65%">
                <stop offset="0%" stop-color="#1e4f4a" />
                <stop offset="55%" stop-color="#103231" />
                <stop offset="100%" stop-color="#061a1a" />
              </radialGradient>
              <linearGradient id="rim-gradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#5a3d2b" />
                <stop offset="40%" stop-color="#3d2a1f" />
                <stop offset="100%" stop-color="#1f1410" />
              </linearGradient>
              <linearGradient id="seat-gradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#262d38" />
                <stop offset="100%" stop-color="#161a22" />
              </linearGradient>
              <radialGradient id="dealer-gradient" cx="35%" cy="30%" r="80%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="60%" stop-color="#ececef" />
                <stop offset="100%" stop-color="#a8a8b0" />
              </radialGradient>
              <linearGradient id="pot-badge-gradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="rgba(20, 28, 36, 0.85)" />
                <stop offset="100%" stop-color="rgba(8, 14, 22, 0.85)" />
              </linearGradient>
              <filter id="table-shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
                <feOffset dx="0" dy="5" />
                <feComponentTransfer><feFuncA type="linear" slope="0.55" /></feComponentTransfer>
                <feMerge>
                  <feMergeNode />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <filter id="card-shadow" x="-25%" y="-25%" width="150%" height="150%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" />
                <feOffset dx="0" dy="1.5" />
                <feComponentTransfer><feFuncA type="linear" slope="0.5" /></feComponentTransfer>
                <feMerge>
                  <feMergeNode />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <ellipse cx="400" cy="260" rx="352" ry="202" class="table-rim" filter="url(#table-shadow)" />
            <ellipse cx="400" cy="260" rx="340" ry="190" class="table-edge" />
            <ellipse cx="400" cy="225" rx="270" ry="120" class="table-glow" />

            <g id="board-a" transform="translate(280 207)"></g>
            <g id="board-b" transform="translate(280 285)"></g>

            <g id="pot-badge">
              <rect x="350" y="158" width="100" height="30" rx="15" class="pot-badge-rect" />
              <text id="pot-label" x="400" y="178" text-anchor="middle" class="pot-label">Pot 0bb</text>
            </g>

            <g id="seats"></g>
            <g id="hero-hole" transform="translate(400 500)"></g>
            <g id="ocr-rescan-group" style="display:none">
              <foreignObject x="218" y="506" width="88" height="32">
                <button xmlns="http://www.w3.org/1999/xhtml" id="ocr-rescan-hole-btn"
                        class="rescan-btn" type="button"
                        title="Re-OCR hero hole cards from the current frame">Rescan Hole</button>
              </foreignObject>
              <foreignObject x="494" y="506" width="88" height="32">
                <button xmlns="http://www.w3.org/1999/xhtml" id="ocr-rescan-board-btn"
                        class="rescan-btn" type="button"
                        title="Re-OCR flop/turn/river from the current frame">Rescan Board</button>
              </foreignObject>
            </g>
            <g id="dealer-button"><circle r="14" class="dealer-circle" /><text class="dealer-text" text-anchor="middle" dy="5">D</text></g>
            <g id="insert-icon" hidden>
              <circle r="14" class="insert-icon-bg" />
              <text class="insert-icon-plus" text-anchor="middle" dy="6">+</text>
            </g>
          </svg>
        </div>

        <div id="actor-banner" class="actor-banner" hidden></div>

        <div class="panels">
          <div id="action-panel" class="panel">
            <h3>Actions</h3>
            <div class="panel-controls">
              <button id="undo-btn" disabled>Undo</button>
            </div>
            <div id="gate-buttons"></div>
            <div id="raise-section" hidden>
              <div class="raise-bounds muted" id="raise-bounds-label"></div>
              <div class="raise-input-row">
                <input id="raise-input" type="number" step="0.01" />
                <span id="raise-unit" class="raise-unit">bb</span>
                <button id="raise-submit" class="primary">Raise</button>
              </div>
              <div id="raise-shortcuts" class="raise-shortcuts"></div>
            </div>
            <div id="terminal-pane" hidden>
              <div id="terminal-message"></div>
            </div>
          </div>

          <div id="info-panel" class="panel">
            <h3>Recommendation</h3>
            <div id="recommendation">
              <p class="muted">Place hero's 5 hole cards to see network output.</p>
            </div>
            <h3>History</h3>
            <div id="history"></div>
          </div>
        </div>
      </section>

      <aside id="card-grid-panel">
        <div class="card-grid-header">
          <span>Cards</span>
          <span id="slot-hint" class="muted">Click a slot to place cards</span>
        </div>
        <div id="card-grid"></div>
      </aside>
    </main>

    <div id="toast-container"></div>

    <script src="/static/app.js"></script>
  </body>
</html>
