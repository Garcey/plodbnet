<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLO5 Bomb-Pot Study Tool</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header id="top-bar">
      <div class="brand">
        <span class="brand-mark">&#9824;</span>
        <span class="brand-name">PLO5 <span class="sub">Bomb-Pot Study</span></span>
      </div>
      <div id="mode-tabs">
        <button id="tab-study" class="mode-tab active" type="button">Study</button>
        <button id="tab-trainer" class="mode-tab" type="button">Trainer</button>
      </div>
      <div class="top-bar-item study-only">
        <label>Seats</label>
        <div class="seat-ctl">
          <button id="seats-dec" type="button" aria-label="Fewer seats">−</button>
          <span id="seats-count">6</span>
          <button id="seats-inc" type="button" aria-label="More seats">+</button>
        </div>
      </div>
      <div class="top-bar-item">
        <label for="unit-toggle">Units</label>
        <button id="unit-toggle" type="button">bb</button>
      </div>
      <div class="top-bar-item study-only">
        <label for="dpb-input">$ / bb</label>
        <input id="dpb-input" type="number" step="0.01" min="0.01" value="20.00" />
      </div>
      <div class="top-bar-item study-only">
        <label for="ante-input">Ante</label>
        <input id="ante-input" type="number" step="0.01" min="0" value="3.00" />
      </div>
      <div class="top-bar-item top-bar-spacer"></div>
      <div class="top-bar-item trainer-only">
        <button id="trainer-settings-btn" type="button" title="Trainer settings">Settings</button>
        <button id="trainer-repeat-btn" type="button" title="Re-deal the same hand (excluded from stats)">Repeat</button>
        <button id="trainer-new-hand-btn" type="button">New Hand</button>
      </div>
      <div class="top-bar-item ocr-group study-only">
        <label for="ocr-window-button">OCR</label>
        <div class="ocr-window-picker">
          <button id="ocr-window-button" type="button" aria-haspopup="listbox"
                  aria-expanded="false" title="Pick the window to screen-read">— pick window —</button>
        </div>
        <button id="ocr-toggle" type="button" aria-pressed="false">Off</button>
        <button id="ocr-simple-toggle" type="button" aria-pressed="true"
                title="Skip OCR action inference; manual action entry only">Simple: On</button>
        <button id="ocr-save-frame" type="button"
                title="Save the current OCR frame to screenrecords/frames/">Save frame</button>
        <span id="ocr-status" class="muted"></span>
      </div>
      <div class="top-bar-item study-only">
        <button id="new-hand-btn" type="button">New Hand</button>
      </div>
    </header>

    <main>
      <section id="table-area">
        <div id="table-wrap">
          <svg id="table-svg" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="felt-gradient" cx="50%" cy="36%" r="70%">
                <stop offset="0%" stop-color="#2c6e5c" />
                <stop offset="50%" stop-color="#175044" />
                <stop offset="100%" stop-color="#0a2b25" />
              </radialGradient>
              <linearGradient id="rim-gradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6e4c33" />
                <stop offset="35%" stop-color="#4a3122" />
                <stop offset="100%" stop-color="#221610" />
              </linearGradient>
              <linearGradient id="seat-gradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#2b3442" />
                <stop offset="100%" stop-color="#161b24" />
              </linearGradient>
              <radialGradient id="dealer-gradient" cx="35%" cy="30%" r="80%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="60%" stop-color="#ececef" />
                <stop offset="100%" stop-color="#a8a8b0" />
              </radialGradient>
              <linearGradient id="pot-badge-gradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="rgba(18, 27, 36, 0.92)" />
                <stop offset="100%" stop-color="rgba(7, 13, 20, 0.92)" />
              </linearGradient>
              <filter id="table-shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
                <feOffset dx="0" dy="5" />
                <feComponentTransfer><feFuncA type="linear" slope="0.55" /></feComponentTransfer>
                <feMerge>
                  <feMergeNode />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <filter id="card-shadow" x="-25%" y="-25%" width="150%" height="150%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" />
                <feOffset dx="0" dy="1.5" />
                <feComponentTransfer><feFuncA type="linear" slope="0.5" /></feComponentTransfer>
                <feMerge>
                  <feMergeNode />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <ellipse cx="400" cy="260" rx="352" ry="202" class="table-rim" filter="url(#table-shadow)" />
            <ellipse cx="400" cy="260" rx="340" ry="190" class="table-edge" />
            <ellipse cx="400" cy="260" rx="300" ry="153" class="table-line" />
            <ellipse cx="400" cy="222" rx="266" ry="116" class="table-glow" />

            <g id="board-a" transform="translate(280 207)"></g>
            <g id="board-b" transform="translate(280 285)"></g>

            <g id="pot-badge">
              <rect x="338" y="154" width="124" height="32" rx="16" class="pot-badge-rect" />
              <text id="pot-label" x="400" y="175" text-anchor="middle" class="pot-label">Pot 0bb</text>
            </g>

            <g id="seats"></g>
            <g id="hero-hole" transform="translate(400 500)"></g>
            <g id="ocr-rescan-group" style="display:none">
              <foreignObject x="218" y="506" width="88" height="32">
                <button xmlns="http://www.w3.org/1999/xhtml" id="ocr-rescan-hole-btn"
                        class="rescan-btn" type="button"
                        title="Re-OCR hero hole cards from the current frame">Rescan Hole</button>
              </foreignObject>
              <foreignObject x="494" y="506" width="88" height="32">
                <button xmlns="http://www.w3.org/1999/xhtml" id="ocr-rescan-board-btn"
                        class="rescan-btn" type="button"
                        title="Re-OCR flop/turn/river from the current frame">Rescan Board</button>
              </foreignObject>
            </g>
            <g id="dealer-button"><circle r="14" class="dealer-circle" /><text class="dealer-text" text-anchor="middle" dy="5">D</text></g>
            <g id="insert-icon" hidden>
              <circle r="14" class="insert-icon-bg" />
              <text class="insert-icon-plus" text-anchor="middle" dy="6">+</text>
            </g>
          </svg>
          <div id="feedback-flash" hidden>
            <span id="feedback-marks"></span>
            <span id="feedback-text"></span>
            <span id="feedback-sub"></span>
          </div>
        </div>

        <div id="actor-banner" class="actor-banner" hidden></div>

        <div id="review-panel" class="panel" hidden>
          <div class="review-left">
            <svg class="score-ring" viewBox="0 0 64 64" width="64" height="64">
              <circle class="ring-bg" cx="32" cy="32" r="26" />
              <circle id="review-ring-fill" class="ring-fill" cx="32" cy="32" r="26" />
              <text id="review-score-num" x="32" y="37" text-anchor="middle">—</text>
            </svg>
            <span class="review-score-caption">GTO score</span>
          </div>
          <div class="review-mid">
            <div class="review-step-row">
              <button id="review-prev" type="button" aria-label="Previous decision">‹</button>
              <span id="review-step-label"></span>
              <button id="review-next" type="button" aria-label="Next decision">›</button>
            </div>
            <div id="review-chips"></div>
            <div id="review-whatif-bar" hidden>
              <span class="whatif-tag">What-if cards active</span>
              <button id="review-whatif-reset" type="button">Reset cards</button>
            </div>
          </div>
          <div id="review-detail"></div>
          <div class="review-actions">
            <button id="review-repeat-hand" type="button">Repeat Hand</button>
            <button id="review-next-hand" class="primary" type="button">Next Hand</button>
          </div>
        </div>

        <div class="panels">
          <div id="action-panel" class="panel">
            <h3>Actions</h3>
            <div class="panel-controls">
              <button id="undo-btn" disabled>Undo</button>
            </div>
            <div id="gate-buttons"></div>
            <div id="raise-section" hidden>
              <div class="raise-bounds muted" id="raise-bounds-label"></div>
              <div class="raise-input-row">
                <input id="raise-input" type="number" step="0.01" />
                <span id="raise-unit" class="raise-unit">bb</span>
                <button id="raise-submit" class="primary">Raise</button>
              </div>
              <div id="raise-shortcuts" class="raise-shortcuts"></div>
            </div>
            <div id="terminal-pane" hidden>
              <div id="terminal-message"></div>
            </div>
          </div>

          <div id="info-panel" class="panel">
            <h3>Recommendation</h3>
            <div id="recommendation">
              <p class="muted">Place hero's 5 hole cards to see network output.</p>
            </div>
            <h3>History</h3>
            <div id="history"></div>
          </div>
        </div>
      </section>

      <aside id="card-grid-panel">
        <div class="card-grid-header">
          <span>Cards</span>
          <span id="slot-hint" class="muted">Click a slot to place cards</span>
        </div>
        <div id="card-grid"></div>
      </aside>

      <aside id="trainer-stats-panel">
        <div class="card-grid-header"><span>Stats</span></div>
        <div id="stats-session" class="stats-block"></div>
        <div id="stats-lifetime" class="stats-block"></div>
      </aside>
    </main>

    <div id="trainer-settings-modal" class="modal-backdrop" hidden>
      <div class="modal">
        <h3>Trainer Settings</h3>
        <div class="ts-row">
          <label>Seats</label>
          <select id="ts-seats-mode">
            <option value="random">Random range</option>
            <option value="fixed">Fixed</option>
          </select>
          <span class="ts-sub" id="ts-seats-fixed-wrap">
            <input id="ts-seats-fixed" type="number" min="2" max="6" step="1" />
          </span>
          <span class="ts-sub" id="ts-seats-range-wrap">
            <input id="ts-seats-min" type="number" min="2" max="6" step="1" /> –
            <input id="ts-seats-max" type="number" min="2" max="6" step="1" />
          </span>
        </div>
        <div class="ts-row">
          <label>Stacks (bb)</label>
          <select id="ts-stacks-mode">
            <option value="fixed">Fixed</option>
            <option value="random">Random range</option>
            <option value="per_seat">Per seat</option>
          </select>
          <span class="ts-sub" id="ts-stack-fixed-wrap">
            <input id="ts-stack-bb" type="number" min="1" max="1000" step="0.5" />
          </span>
          <span class="ts-sub" id="ts-stack-range-wrap">
            <input id="ts-stack-min-bb" type="number" min="1" max="1000" step="0.5" /> –
            <input id="ts-stack-max-bb" type="number" min="1" max="1000" step="0.5" />
          </span>
        </div>
        <div class="ts-row" id="ts-per-seat-wrap">
          <label>Per-seat ranges</label>
          <div id="ts-per-seat"></div>
        </div>
        <div class="ts-row">
          <label>Hero position</label>
          <select id="ts-hero-mode">
            <option value="random">Random seat</option>
            <option value="kth">Fixed (k-th to act)</option>
          </select>
          <span class="ts-sub" id="ts-hero-kth-wrap">
            <select id="ts-hero-kth">
              <option value="1">1st to act</option>
              <option value="2">2nd to act</option>
              <option value="3">3rd to act</option>
              <option value="4">4th to act</option>
              <option value="5">5th to act</option>
              <option value="6">6th to act</option>
            </select>
          </span>
        </div>
        <div class="ts-row">
          <label>Ante (bb)</label>
          <input id="ts-ante-bb" type="number" min="0" max="100" step="0.5" />
        </div>
        <div class="ts-row">
          <label>EV rollouts</label>
          <input id="ts-mc-rollouts" type="number" min="0" max="256" step="1"
                 title="Monte-Carlo rollouts per EV-loss estimate; 0 disables EV loss" />
        </div>
        <div class="ts-row">
          <label>$ per 1bb</label>
          <input id="ts-dollars-bb" type="number" min="0.01" max="100000" step="0.5"
                 title="Dollar value of one big blind when the display unit is $" />
        </div>
        <p class="muted">Changes apply from the next hand.</p>
        <div class="modal-buttons">
          <button id="ts-cancel" type="button">Cancel</button>
          <button id="ts-save" class="primary" type="button">Save</button>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>

    <script src="/static/app.js"></script>
  </body>
</html>
